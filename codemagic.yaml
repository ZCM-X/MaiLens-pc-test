workflows:
  mai-lens-remote-capture-ios:
    name: MaiLens PC test unsigned IPA
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Export Core ML detector
        script: |
          # Core ML conversion only works on macOS/Linux, so the phone model is
          # produced here and bundled into the app as MachineDetector.mlpackage.
          # A failure must not block the unsigned IPA.
          python3 -m venv .coreml-env
          .coreml-env/bin/python -m pip install --upgrade pip
          .coreml-env/bin/python -m pip install "ultralytics>=8.3" "coremltools>=9.0" "onnx>=1.16" "numpy<=2.3.5" || true
          .coreml-env/bin/python Training/export_coreml.py \
            || echo "Core ML export failed; building without the bundled detector"
      - name: Generate Xcode project
        script: xcodegen generate --spec project.yml
      - name: Archive unsigned app
        script: |
          xcodebuild -project MaiLensRemoteCapture.xcodeproj \
            -scheme MaiLensRemoteCapture \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/MaiLensRemoteCapture.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO archive
      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/ipa/staging/Payload
          cp -R build/MaiLensRemoteCapture.xcarchive/Products/Applications/MaiLensRemoteCapture.app build/ios/ipa/staging/Payload/
          cd build/ios/ipa/staging
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload ../MaiLensRemoteCapture-unsigned.ipa
    artifacts:
      - build/ios/ipa/MaiLensRemoteCapture-unsigned.ipa

