workflows:
  mai-lens-remote-capture-ios:
    name: MaiLens PC test unsigned IPA
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate --spec project.yml
      - name: Archive unsigned app
        script: |
          xcodebuild -project MaiLensRemoteCapture.xcodeproj \
            -scheme MaiLensRemoteCapture \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/MaiLensRemoteCapture.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO archive
      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/ipa/staging/Payload
          cp -R build/MaiLensRemoteCapture.xcarchive/Products/Applications/MaiLensRemoteCapture.app build/ios/ipa/staging/Payload/
          cd build/ios/ipa/staging
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload ../MaiLensRemoteCapture-unsigned.ipa
    artifacts:
      - build/ios/ipa/MaiLensRemoteCapture-unsigned.ipa

